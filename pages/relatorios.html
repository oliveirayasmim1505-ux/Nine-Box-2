<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios — Portal de Estágio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>if(localStorage.getItem('darkMode')==='1')document.documentElement.classList.add('dark-mode-early');</script>
  <script>
    // Guard de rota: estagiários não podem acessar Relatórios
    (function(){
      try {
        var s = JSON.parse(localStorage.getItem('perfilLogado') || 'null');
        if (!s) return;
        var c = JSON.parse(localStorage.getItem('contatos') || '[]');
        var u = c.find(function(x){ return x.id === s.id; });
        if (u && u.tipo === 'estagiario') window.location.replace('../index.html');
      } catch(e){}
    })();
  </script>
  <link rel="stylesheet" href="../css/nova-avaliacao.css">
  <link rel="stylesheet" href="../css/enhancements.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<header>
  <h2>Relatórios</h2>
  <div class="busca-global-wrap" id="busca-global-wrap">
    <i class="fa-solid fa-magnifying-glass busca-global-icon"></i>
    <input type="text" class="busca-global-input" id="busca-global-input" placeholder="Buscar pessoas, avaliações..." autocomplete="off" oninput="buscarGlobal(this.value)" onfocus="buscarGlobal(this.value)">
    <div class="busca-global-dropdown" id="busca-global-dropdown"></div>
  </div>
  <button id="dark-mode-btn" onclick="toggleDarkMode()" title="Modo escuro" aria-label="Alternar modo escuro"><i class="fa-solid fa-moon" aria-hidden="true"></i></button>
  <div class="notif-wrap" id="notif-wrap">
    <button id="notif-btn" onclick="toggleNotifDropdown()" title="Notificações" aria-label="Ver notificações" aria-haspopup="true">
      <i class="fa-solid fa-bell" aria-hidden="true"></i>
      <span class="notif-badge" style="display:none" aria-live="polite">0</span>
    </button>
    <div class="notif-dropdown" id="notif-dropdown">
      <div class="notif-dropdown-header"><i class="fa-solid fa-bell"></i> Notificações</div>
      <div id="notif-lista"><div class="notif-empty">Nenhuma notificação pendente.</div></div>
    </div>
  </div>
  <a href="../index.html" style="display:none">x</a>
</header>

<nav class="navbar">
  <ul class="navbar-nav">
    <li class="navbar-item">
      <a href="../index.html" class="navbar-link">
        <i class="fa-solid fa-home"></i>
        <span>Início</span>
      </a>
    </li>
    <li class="navbar-item">
      <a href="cadastrar.html" class="navbar-link">
        <i class="fa-solid fa-user-plus"></i>
        <span>Cadastrar</span>
      </a>
    </li>
    <li class="navbar-item">
      <a href="consultar.html" class="navbar-link">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Consultar</span>
      </a>
    </li>
    <li class="navbar-item navbar-item-dropdown">
      <a href="#" class="navbar-link navbar-link-dropdown" onclick="toggleSubmenu(event, this)">
        <i class="fa-solid fa-star"></i>
        <span>Avaliações</span>
        <i class="fa-solid fa-chevron-down navbar-chevron"></i>
      </a>
      <ul class="navbar-submenu">
        <li><a href="avaliacoes.html" class="navbar-submenu-link"><i class="fa-solid fa-star"></i> Avaliações</a></li>
        <li><a href="nine-box.html" class="navbar-submenu-link"><i class="fa-solid fa-th"></i> Nine Box</a></li>
        <li><a href="competencias.html" class="navbar-submenu-link"><i class="fa-solid fa-clipboard-check"></i> Competências</a></li>
        <li><a href="avaliacao-180.html" class="navbar-submenu-link"><i class="fa-solid fa-rotate"></i> 180°</a></li>
      </ul>
    </li>
    <li class="navbar-item">
      <a href="relatorios.html" class="navbar-link active">
        <i class="fa-solid fa-chart-bar"></i>
        <span>Relatórios</span>
      </a>
    </li>
    <li class="navbar-item">
      <a href="../perfil.html" class="navbar-link">
        <i class="fa-solid fa-user"></i>
        <span>Perfil</span>
      </a>
    </li>
    <li class="navbar-item">
      <a href="contatos.html" class="navbar-link">
        <i class="fa-solid fa-address-book"></i>
        <span>Contatos</span>
      </a>
    </li>
    <li class="navbar-item">
      <a href="sobre.html" class="navbar-link">
        <i class="fa-solid fa-circle-info"></i>
        <span>Sobre</span>
      </a>
    </li>
  </ul>
</nav>

<main class="wrapper pg-wrapper">
  <div class="pg-card pg-card-wide">

    <!-- RESUMO CARDS -->
    <div class="rel-resumo" id="rel-resumo"></div>

    <!-- TOOLBAR -->
    <div class="pg-toolbar" style="margin-top: 24px;">
      <div class="pg-filtros">
        <button class="pg-filtro active" data-filtro="todos" onclick="filtrarRel('todos')">Todos</button>
        <button class="pg-filtro" data-filtro="professor" onclick="filtrarRel('professor')">Gestores</button>
        <button class="pg-filtro" data-filtro="estagiario" onclick="filtrarRel('estagiario')">Estagiários</button>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="pg-search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="busca-rel" placeholder="Buscar avaliado..." oninput="filtrarRel()">
        </div>
        <button onclick="exportarCSV()" style="margin:0;width:auto;padding:8px 16px;font-size:12px;display:flex;align-items:center;gap:6px">
          <i class="fa-solid fa-download"></i> Exportar CSV
        </button>
      </div>
    </div>

    <!-- TABELA -->
    <div class="rel-table-wrap">
      <table class="rel-table" id="rel-tabela">
        <thead>
          <tr>
            <th>Avaliado</th>
            <th>Tipo</th>
            <th>Critérios</th>
            <th>Média</th>
            <th>Comentário</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="rel-tbody">
          <tr><td colspan="6" class="pg-empty">Nenhuma avaliação registrada.</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</main>

<script src="../js/script.js"></script>
<script src="../js/pages.js"></script>
<script src="../js/busca-global.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/nova-avaliacao.js"></script>
<script src="../js/enhancements.js"></script>
</body>
</html>
